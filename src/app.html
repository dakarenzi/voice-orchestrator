<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width" />
    <link rel="manifest" href="/manifest.json" />
    %sveltekit.head%
    <script>
        // Zero-flash theme detection
        (function () {
            try {
                const stored = localStorage.getItem('vo-theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const prefersHighContrast = window.matchMedia('(prefers-contrast: more)').matches;

                let theme = stored || 'system';
                if (theme === 'system') {
                    theme = prefersHighContrast ? 'high-contrast' : (prefersDark ? 'dark' : 'light');
                }

                document.documentElement.setAttribute('data-theme', theme);

                // Both 'dark' and 'high-contrast' trigger the Tailwind 'dark' class
                if (theme === 'dark' || theme === 'high-contrast') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }

                // Update meta theme-color immediately
                const metacolors = {
                    'light': '#ffffff',
                    'dark': '#0a0a0a',
                    'high-contrast': '#000000'
                };
                const metacolor = metacolors[theme] || '#0a0a0a';

                let meta = document.querySelector('meta[name="theme-color"]');
                if (!meta) {
                    meta = document.createElement('meta');
                    meta.name = 'theme-color';
                    document.head.appendChild(meta);
                }
                meta.content = metacolor;
            } catch (e) {
                console.error('Theme detection failed', e);
            }
        })();
    </script>
</head>

<body data-sveltekit-preload-data="hover" class="bg-background text-foreground transition-colors duration-300">
    <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
